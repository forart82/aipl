<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#131C31"/>
    </linearGradient>

    <!-- Outer Shield Border Gradient -->
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Plaque Border Gradient -->
    <linearGradient id="plaqueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Neural Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Outer Glow Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#00F0FF" stroke-width="16" stroke-opacity="0.15" filter="url(#dropShadow)"/>

  <!-- Main Cyber Shield Badge -->
  <rect x="28" y="28" width="456" height="456" rx="84" fill="url(#bgGrad)" stroke="url(#shieldBorderGrad)" stroke-width="8"/>

  <!-- Subtle Circuit Grid Pattern in Background -->
  <g opacity="0.12" stroke="#00F0FF" stroke-width="1.5">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="260" x2="432" y2="260"/>
    <line x1="160" y1="80" x2="160" y2="432"/>
    <line x1="352" y1="80" x2="352" y2="432"/>
    <circle cx="160" cy="160" r="4" fill="#00F0FF"/>
    <circle cx="352" cy="160" r="4" fill="#00F0FF"/>
    <circle cx="160" cy="260" r="4" fill="#00F0FF"/>
    <circle cx="352" cy="260" r="4" fill="#00F0FF"/>
  </g>

  <!-- 4 Corner Micro-Badges -->
  <!-- 1. Top-Left: SMT Formal Verification Shield (Emerald #10B981) -->
  <g transform="translate(86, 86)">
    <circle cx="0" cy="0" r="28" fill="#042F2E" stroke="#10B981" stroke-width="3" filter="url(#glowEmerald)"/>
    <path d="M -10 -1 L -3 6 L 10 -7" fill="none" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#10B981" text-anchor="middle" letter-spacing="1">SMT</text>
  </g>

  <!-- 2. Top-Right: AI Neural Spark (Magenta/Violet #EC4899) -->
  <g transform="translate(426, 86)">
    <circle cx="0" cy="0" r="28" fill="#4A044E" stroke="#EC4899" stroke-width="3" filter="url(#glowMagenta)"/>
    <!-- 4-pointed Spark -->
    <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" fill="#EC4899"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    <text x="0" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#EC4899" text-anchor="middle" letter-spacing="1">AI</text>
  </g>

  <!-- 3. Bottom-Left: Native Binary Chip (Cyan #00F0FF) -->
  <g transform="translate(86, 426)">
    <circle cx="0" cy="0" r="28" fill="#082F49" stroke="#00F0FF" stroke-width="3" filter="url(#glowCyan)"/>
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#0284C7" stroke="#00F0FF" stroke-width="2"/>
    <line x1="-6" y1="-13" x2="-6" y2="-10" stroke="#00F0FF" stroke-width="2"/>
    <line x1="0" y1="-13" x2="0" y2="-10" stroke="#00F0FF" stroke-width="2"/>
    <line x1="6" y1="-13" x2="6" y2="-10" stroke="#00F0FF" stroke-width="2"/>
    <line x1="-6" y1="10" x2="-6" y2="13" stroke="#00F0FF" stroke-width="2"/>
    <line x1="0" y1="10" x2="0" y2="13" stroke="#00F0FF" stroke-width="2"/>
    <line x1="6" y1="10" x2="6" y2="13" stroke="#00F0FF" stroke-width="2"/>
    <text x="0" y="4" font-family="monospace" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">C99</text>
  </g>

  <!-- 4. Bottom-Right: SIMD/GPU Tensor Matrix (Amber #F59E0B) -->
  <g transform="translate(426, 426)">
    <circle cx="0" cy="0" r="28" fill="#451A03" stroke="#F59E0B" stroke-width="3"/>
    <g fill="#F59E0B">
      <circle cx="-8" cy="-8" r="2.5"/><circle cx="0" cy="-8" r="2.5"/><circle cx="8" cy="-8" r="2.5"/>
      <circle cx="-8" cy="0" r="2.5"/><circle cx="0" cy="0" r="3" fill="#FFFFFF"/><circle cx="8" cy="0" r="2.5"/>
      <circle cx="-8" cy="8" r="2.5"/><circle cx="0" cy="8" r="2.5"/><circle cx="8" cy="8" r="2.5"/>
    </g>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="2 2"/>
    <text x="0" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#F59E0B" text-anchor="middle" letter-spacing="0.5">SIMD</text>
  </g>

  <!-- Code Brackets Framing the AST Core -->
  <!-- Left Bracket < -->
  <path d="M 148 150 L 108 196 L 148 242" fill="none" stroke="#00F0FF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>
  <!-- Right Bracket > -->
  <path d="M 364 150 L 404 196 L 364 242" fill="none" stroke="#00F0FF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowCyan)"/>

  <!-- AI Neural Graph & AST Prism (Hexagonal Syntax Tree) -->
  <g id="ast-prism">
    <!-- Graph Edges -->
    <g stroke-linecap="round" opacity="0.85">
      <!-- Root to Upper Leaves -->
      <line x1="256" y1="108" x2="195" y2="152" stroke="#10B981" stroke-width="3.5"/>
      <line x1="256" y1="108" x2="317" y2="152" stroke="#10B981" stroke-width="3.5"/>
      <line x1="256" y1="108" x2="256" y2="196" stroke="#00F0FF" stroke-width="3" stroke-dasharray="4 3"/>

      <!-- Lateral & Cross Connections -->
      <line x1="195" y1="152" x2="317" y2="152" stroke="#8B5CF6" stroke-width="2.5" opacity="0.6"/>
      <line x1="195" y1="152" x2="256" y2="196" stroke="#00F0FF" stroke-width="3.5"/>
      <line x1="317" y1="152" x2="256" y2="196" stroke="#EC4899" stroke-width="3.5"/>

      <!-- Lower Branch Connections -->
      <line x1="195" y1="152" x2="208" y2="256" stroke="#00F0FF" stroke-width="3.5"/>
      <line x1="317" y1="152" x2="304" y2="256" stroke="#EC4899" stroke-width="3.5"/>

      <line x1="256" y1="196" x2="208" y2="256" stroke="#00F0FF" stroke-width="3.5"/>
      <line x1="256" y1="196" x2="304" y2="256" stroke="#EC4899" stroke-width="3.5"/>
      <line x1="208" y1="256" x2="304" y2="256" stroke="#8B5CF6" stroke-width="2.5" opacity="0.6"/>

      <!-- Base Stem to Root Core -->
      <line x1="208" y1="256" x2="256" y2="292" stroke="#10B981" stroke-width="3.5"/>
      <line x1="304" y1="256" x2="256" y2="292" stroke="#10B981" stroke-width="3.5"/>
      <line x1="256" y1="196" x2="256" y2="292" stroke="#10B981" stroke-width="3"/>
    </g>

    <!-- Lambda Symbol in the Prism Core -->
    <path d="M 242 168 L 268 226 M 256 198 L 244 226" fill="none" stroke="#F43F5E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

    <!-- Neural Nodes -->
    <!-- Root Node (SMT Emerald #10B981) -->
    <circle cx="256" cy="108" r="11" fill="#10B981" filter="url(#glowEmerald)"/>
    <circle cx="256" cy="108" r="5" fill="#FFFFFF"/>

    <!-- Upper-Left Node (Cyan #00F0FF) -->
    <circle cx="195" cy="152" r="10" fill="#00F0FF" filter="url(#glowCyan)"/>
    <circle cx="195" cy="152" r="4.5" fill="#FFFFFF"/>

    <!-- Upper-Right Node (Magenta #EC4899) -->
    <circle cx="317" cy="152" r="10" fill="#EC4899" filter="url(#glowMagenta)"/>
    <circle cx="317" cy="152" r="4.5" fill="#FFFFFF"/>

    <!-- Central Crystal Node (Electric Violet #8B5CF6) -->
    <circle cx="256" cy="196" r="12" fill="#8B5CF6"/>
    <circle cx="256" cy="196" r="5.5" fill="#FFFFFF"/>

    <!-- Lower-Left Node (Cyan #00F0FF) -->
    <circle cx="208" cy="256" r="9" fill="#00F0FF" filter="url(#glowCyan)"/>
    <circle cx="208" cy="256" r="4" fill="#FFFFFF"/>

    <!-- Lower-Right Node (Magenta #EC4899) -->
    <circle cx="304" cy="256" r="9" fill="#EC4899" filter="url(#glowMagenta)"/>
    <circle cx="304" cy="256" r="4" fill="#FFFFFF"/>

    <!-- Bottom Stem Node (Emerald #10B981) -->
    <circle cx="256" cy="292" r="8" fill="#10B981" filter="url(#glowEmerald)"/>
    <circle cx="256" cy="292" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography Plaque Banner in Lower Third -->
  <g transform="translate(256, 376)">
    <!-- Dark Glass Banner Base -->
    <rect x="-145" y="-44" width="290" height="88" rx="20" fill="url(#plaqueGrad)" stroke="#00F0FF" stroke-width="2.5" stroke-opacity="0.8" filter="url(#dropShadow)"/>

    <!-- AIPL Wordmark -->
    <text x="0" y="16" font-family="'JetBrains Mono', 'Liberation Mono', -apple-system, monospace" font-size="56" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="6" filter="url(#dropShadow)">AIPL</text>

    <!-- Subtitle Banner -->
    <text x="0" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="3.5">SMT • NATIVE • AI</text>
  </g>
</svg>
